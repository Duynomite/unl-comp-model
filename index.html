  <!--
    UNL Ancillary Comp Model — agent-facing compensation calculator for CPC agents.

    AGENT-ONLY DIRECTIVE (per Connor 2026-05-14):
    This tool must NEVER display agency commission rates, agency retained spread,
    or any agency-side compensation values. The RATES constant below contains
    ONLY computed agent-side rates. Internal keys (standard / adjusted / adjustedMid /
    adjustedLow) are not user-visible labels — the UI surfaces literal state lists.

    ACCURACY DIRECTIVE: Agent rates derived from the UNL state commission grid
    (received 2026-05-14) via two fixed proportions:
      - Year 1 split: 25 / 75 = 33.33% of carrier Y1 rate
      - Renewal split: 5 / 13 = 38.46% of carrier renewal rate
    Anchor: HHC standard states → 25.00% Y1 / 5.00% renewal at $1,000 AP.
  -->

  <script type="text/babel">
    const { useState, useMemo } = React;

    // ============================================================================
    // DATA LAYER — agent-side values only. See AGENT-ONLY DIRECTIVE at top of file.
    // ============================================================================
    const RATES = {
      HHC: {
        standard: {
          states: ['AL','AR','AZ','GA','IA','ID','IL','IN','KS','KY','LA','MI','MO','MS','NC','NE','NV','OH','OK','PA','SC','TN','TX','WV','WY'],
          y1: 0.2500,
          renewal: 0.0500,
        },
        adjusted: {
          states: ['CO','DE','SD'],
          y1: 0.2167,
          renewal: 0.0308,
        },
        ageMin: 55,
        ageMax: 85,
      },
      HI: {
        standard: {
          states: ['AL','AR','FL','GA','IA','ID','IL','KS','LA','MO','MS','NC','NE','NV','OH','OK','PA','SC','TN','TX','UT','WI','WV','WY'],
          y1Young: 0.2500, y1Senior: 0.2167,
          renewalY2to10: 0.0577, renewalY11: 0.0308,
        },
        adjustedMid: {
          states: ['AZ','DE','IN','KY','MD','MI','ND','VA'],
          y1Young: 0.2333, y1Senior: 0.2000,
          renewalY2to10: 0.0385, renewalY11: 0.0231,
        },
        adjustedLow: {
          states: ['CO','MN','SD'],
          y1Young: 0.2333, y1Senior: 0.2000,
          renewalY2to10: 0.0231, renewalY11: 0.0115,
        },
        ageMin: 50,
        ageMax: 85,
        seniorAge: 80,
      },
      paymentSplit: { advancePct: 0.75, residualMonths: [10, 11, 12] },
      chargeback: { advanceWindowMonths: 9 },
    };

    const STATES = [
      ['AL','Alabama'], ['AK','Alaska'], ['AZ','Arizona'], ['AR','Arkansas'], ['CA','California'],
      ['CO','Colorado'], ['CT','Connecticut'], ['DE','Delaware'], ['DC','District of Columbia'],
      ['FL','Florida'], ['GA','Georgia'], ['HI','Hawaii'], ['ID','Idaho'], ['IL','Illinois'],
      ['IN','Indiana'], ['IA','Iowa'], ['KS','Kansas'], ['KY','Kentucky'], ['LA','Louisiana'],
      ['ME','Maine'], ['MD','Maryland'], ['MA','Massachusetts'], ['MI','Michigan'], ['MN','Minnesota'],
      ['MS','Mississippi'], ['MO','Missouri'], ['MT','Montana'], ['NE','Nebraska'], ['NV','Nevada'],
      ['NH','New Hampshire'], ['NJ','New Jersey'], ['NM','New Mexico'], ['NY','New York'],
      ['NC','North Carolina'], ['ND','North Dakota'], ['OH','Ohio'], ['OK','Oklahoma'], ['OR','Oregon'],
      ['PA','Pennsylvania'], ['RI','Rhode Island'], ['SC','South Carolina'], ['SD','South Dakota'],
      ['TN','Tennessee'], ['TX','Texas'], ['UT','Utah'], ['VT','Vermont'], ['VA','Virginia'],
      ['WA','Washington'], ['WV','West Virginia'], ['WI','Wisconsin'], ['WY','Wyoming'],
    ].sort((a, b) => a[1].localeCompare(b[1]));

    function lookupRate(product, stateCode, age) {
      if (product === 'HHC') {
        if (age < RATES.HHC.ageMin || age > RATES.HHC.ageMax) {
          return { eligible: false, reason: 'age', ageRange: `${RATES.HHC.ageMin}–${RATES.HHC.ageMax}` };
        }
        if (RATES.HHC.standard.states.includes(stateCode)) {
          return { eligible: true, y1: RATES.HHC.standard.y1, renewal: RATES.HHC.standard.renewal };
        }
        if (RATES.HHC.adjusted.states.includes(stateCode)) {
          return { eligible: true, y1: RATES.HHC.adjusted.y1, renewal: RATES.HHC.adjusted.renewal };
        }
        return { eligible: false, reason: 'state' };
      }
      if (product === 'HI') {
        if (age < RATES.HI.ageMin || age > RATES.HI.ageMax) {
          return { eligible: false, reason: 'age', ageRange: `${RATES.HI.ageMin}–${RATES.HI.ageMax}` };
        }
        const isSenior = age >= RATES.HI.seniorAge;
        const tier = [RATES.HI.standard, RATES.HI.adjustedMid, RATES.HI.adjustedLow]
          .find(c => c.states.includes(stateCode));
        if (!tier) return { eligible: false, reason: 'state' };
        return {
          eligible: true,
          y1: isSenior ? tier.y1Senior : tier.y1Young,
          renewalY2to10: tier.renewalY2to10,
          renewalY11: tier.renewalY11,
          isSenior,
        };
      }
    }

    // ============================================================================
    // FORMAT HELPERS
    // ============================================================================
    const fmt$ = (v) => '$' + (v || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const fmtPct = (v) => (v * 100).toFixed(2) + '%';

    // ============================================================================
    // COMPONENTS
    // ============================================================================

    function KpiTile({ label, value, sub }) {
      return (
        <div className="bg-white/10 backdrop-blur rounded-xl p-5 border border-white/10">
          <div className="text-white/70 text-xs uppercase tracking-widest mb-1.5 font-heading font-semibold">{label}</div>
          <div className="text-accent font-heading font-bold text-3xl sm:text-4xl tabular-nums">{value}</div>
          {sub && <div className="text-white/60 text-xs mt-1.5">{sub}</div>}
        </div>
      );
    }

    function Hero() {
      return (
        <section className="bg-gradient-to-br from-secondary to-deep-navy text-white rounded-2xl p-8 sm:p-12 shadow-xl">
          <div className="text-accent text-xs uppercase tracking-widest font-heading font-semibold mb-3">UNL Ancillary — Agent Compensation</div>
          <h1 className="font-heading font-bold text-4xl sm:text-5xl lg:text-6xl leading-tight mb-3">
            Build a six-figure career selling ancillary.
          </h1>
          <p className="text-white/80 text-base sm:text-lg max-w-2xl mb-8">
            Home Healthcare Shield + Hospital Indemnity Shield. CPC covers your leads. UNL (the carrier) pays CPC the commission, CPC pays you out — full take-home on every sale, every renewal, every year the policy stays in force.
          </p>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <KpiTile label="Year 1 commission" value="25%" sub="Of annual premium · ≈$195 on a typical $780 sale" />
            <KpiTile label="Annual renewal" value="5%" sub="Every year the policy stays in force" />
            <KpiTile label="Realistic annual income" value="$34K–$200K+" sub="Building agent (1/day) → Top performer (5–7/day) · slider below" />
          </div>
        </section>
      );
    }

    // ============================================================================
    // WHY ANCILLARY — three structural reasons agents miss
    // ============================================================================
    function WhyAncillary() {
      return (
        <section className="bg-white rounded-2xl p-6 sm:p-8 shadow-sm border border-light-cyan">
          <div className="mb-5">
            <div className="text-xs uppercase font-heading font-semibold text-accent tracking-widest mb-2">Why ancillary now</div>
            <h2 className="font-heading font-bold text-2xl sm:text-3xl text-deep-navy mb-1">Three things agents don't see until they're in it.</h2>
          </div>
          <div className="grid md:grid-cols-3 gap-4">
            <div className="bg-light-cyan/30 rounded-xl p-5 border border-light-cyan">
              <div className="font-heading font-bold text-deep-navy text-3xl mb-1">1</div>
              <div className="font-heading font-semibold text-secondary text-base mb-2">It smooths your calendar.</div>
              <div className="text-sm text-text leading-relaxed">MA is gated by AEP / OEP / SEP. Income peaks Oct–Mar and drops sharply the rest of the year. <strong className="text-secondary">Ancillary has no enrollment codes</strong> — you sell it 365 days a year. The SEP-season income gap most MA agents feel? Ancillary fills it.</div>
            </div>
            <div className="bg-light-cyan/30 rounded-xl p-5 border border-light-cyan">
              <div className="font-heading font-bold text-deep-navy text-3xl mb-1">2</div>
              <div className="font-heading font-semibold text-secondary text-base mb-2">It's structurally stable.</div>
              <div className="text-sm text-text leading-relaxed">When CMS changes a rule, a carrier exits a market, or commission schedules shift, your MA commissions are exposed. <strong className="text-secondary">Ancillary is state-regulated indemnity</strong> — far less affected by Medicare regulatory volatility. When the ground shifts under you, your ancillary commissions stay put.</div>
            </div>
            <div className="bg-light-cyan/30 rounded-xl p-5 border border-light-cyan">
              <div className="font-heading font-bold text-deep-navy text-3xl mb-1">3</div>
              <div className="font-heading font-semibold text-secondary text-base mb-2">It pays you renewals — not just upfront.</div>
              <div className="text-sm text-text leading-relaxed">MA at CPC pays you upfront commission only. <strong className="text-secondary">Ancillary pays you upfront AND a 5% renewal every year</strong> the policy stays in force. Sell a policy in Year 1, you keep collecting on it in Year 2, Year 3, Year 4 — and your renewal income compounds as new cohorts stack on top. Attaching ancillary to an MA sale also lifts retention on both policies — fewer MA chargebacks for you.</div>
            </div>
          </div>
          <div className="mt-5 bg-deep-navy text-white rounded-xl p-5 text-sm leading-relaxed">
            The customer is better protected. You earn more, your customers stick longer, and you become the agent who solves whole-coverage problems instead of one-policy problems. <span className="text-accent font-heading font-semibold">Win-win-win — structurally.</span>
          </div>
        </section>
      );
    }

    // ============================================================================
    // CAREER MATH — typical UNL ancillary sale
    // Source: Connor 2026-05-14. $780 avg annual premium ($65/mo). Standard-state
    // rates (HHC: 25% Y1 / 5% renewal). 20 workdays/mo × 12 = 240 submits per
    // sale/day. Option B for lapse math: non-M12 policies net ~50% of gross
    // (advance paid, partial chargeback averaged across Mo 1-11 lapse timing).
    // ============================================================================
    const CAREER = {
      typicalAP: 780,
      y1Rate: 0.25,                // Agent earns 25% of AP in standard-rate states
      renewalRate: 0.05,           // Agent earns 5% of AP renewal in standard-rate states
      workdaysPerMonth: 20,
      monthsPerYear: 12,
      partialEarningFactor: 0.5,   // Option B: lapsed non-M12 policies net half on average
    };

    function perSaleGross(ap) { return ap * CAREER.y1Rate; }
    function perSaleRenewal(ap) { return ap * CAREER.renewalRate; }

    // Effective Y1 per submit at given placement + M12 retention (Option B)
    // = placement × gross × (M12 × 1.0 + (1 - M12) × 0.5)
    // = placement × gross × (0.5 + 0.5 × M12)
    function effectivePerSubmit(ap, placement, m12) {
      return placement * perSaleGross(ap) * (0.5 + 0.5 * m12);
    }

    // M12 survivors per cohort (these generate renewals)
    function m12SurvivorsPerYear(submitsPerYear, placement, m12) {
      return submitsPerYear * placement * m12;
    }

    // 5-year income projection
    // For year y: renewal income = sum over prior cohorts c of m12Surv × y2Ret^(y-c-1)
    function projectFiveYears(submitsPerYear, ap, placement, m12, y2Ret) {
      const y1Annual = submitsPerYear * effectivePerSubmit(ap, placement, m12);
      const survPerCohort = m12SurvivorsPerYear(submitsPerYear, placement, m12);
      const renewalPer = perSaleRenewal(ap);
      const years = [];
      for (let y = 1; y <= 5; y++) {
        let renewal = 0;
        for (let c = 1; c < y; c++) {
          // Cohort sold in year c, contributing renewal in year y
          renewal += survPerCohort * Math.pow(y2Ret, y - c - 1) * renewalPer;
        }
        years.push({ year: y, y1: y1Annual, renewal, total: y1Annual + renewal });
      }
      return years;
    }

    // ============================================================================
    // CAREER OUTLOOK — volume tier reference card
    // ============================================================================
    const TIERS = [
      { name: 'Building', salesPerDay: 1, blurb: 'Learning the script, working leads part-time' },
      { name: 'Steady', salesPerDay: 2, blurb: 'Consistent daily volume, full-time pace' },
      { name: 'Strong', salesPerDay: 3, blurb: 'Practiced closer, full pipeline' },
      { name: 'Top performer', salesPerDay: 5, salesRange: '4–6', blurb: 'Specialist, optimized funnel' },
    ];

    function CareerOutlook() {
      // Use default 80/80/85 assumptions for the tier display
      return (
        <section className="bg-white rounded-2xl p-6 sm:p-8 shadow-sm border border-light-cyan">
          <div className="mb-5">
            <h2 className="font-heading font-bold text-2xl sm:text-3xl text-deep-navy mb-1">Your career at a glance.</h2>
            <p className="text-mid-blue text-sm">Realistic annual income at different activity levels. Assumes typical $780 premium, 80% placement rate (applications that take effect), 80% Year 1 retention (policies still active at month 12), 85% renewals retention thereafter.</p>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
            {TIERS.map((t) => {
              const submitsYr = t.salesPerDay * CAREER.workdaysPerMonth * CAREER.monthsPerYear;
              const projection = projectFiveYears(submitsYr, CAREER.typicalAP, 0.80, 0.80, 0.85);
              const y1 = projection[0].total;
              const y5 = projection[4].total;
              const isTop = t.name === 'Top performer';
              return (
                <div key={t.name}
                  className={`rounded-xl p-5 border-2 ${isTop ? 'bg-deep-navy text-white border-accent' : 'bg-light-cyan/30 border-light-cyan'}`}>
                  <div className={`text-xs uppercase tracking-widest font-heading font-semibold mb-2 ${isTop ? 'text-accent' : 'text-secondary'}`}>{t.name}</div>
                  <div className={`text-2xl font-heading font-bold tabular-nums ${isTop ? 'text-white' : 'text-deep-navy'}`}>
                    {t.salesRange ? `${t.salesRange}/day` : `${t.salesPerDay}/day`}
                  </div>
                  <div className={`text-xs mt-1 ${isTop ? 'text-soft-blue' : 'text-mid-blue'}`}>{t.blurb}</div>
                  <div className={`mt-4 pt-4 border-t ${isTop ? 'border-white/20' : 'border-light-cyan'}`}>
                    <div className={`text-xs uppercase tracking-wider ${isTop ? 'text-soft-blue' : 'text-mid-blue'}`}>Year 1</div>
                    <div className={`font-heading font-bold text-xl tabular-nums ${isTop ? 'text-accent' : 'text-deep-navy'}`}>${Math.round(y1).toLocaleString()}</div>
                  </div>
                  <div className="mt-3">
                    <div className={`text-xs uppercase tracking-wider ${isTop ? 'text-soft-blue' : 'text-mid-blue'}`}>Year 5 total</div>
                    <div className={`font-heading font-bold text-xl tabular-nums ${isTop ? 'text-accent' : 'text-deep-navy'}`}>${Math.round(y5).toLocaleString()}</div>
                  </div>
                </div>
              );
            })}
          </div>
          <div className="mt-4 text-xs text-mid-blue bg-light-cyan/40 rounded-lg p-3">
            <strong className="text-secondary">How to read this:</strong> Both numbers are <em>annual income</em>, not cumulative totals. <strong>Year 1</strong> is what you earn in your first full year of selling (new commissions only). <strong>Year 5</strong> is what you earn in year five — new commissions that year <em>plus</em> renewals from the four prior years that are still in force. Slide the calculator below to model your own pace.
          </div>
        </section>
      );
    }

    // ============================================================================
    // HOW IT WORKS — educational block for new agents
    // ============================================================================
    function HowItWorks() {
      return (
        <section className="bg-white rounded-2xl p-6 sm:p-8 shadow-sm border border-light-cyan">
          <h2 className="font-heading font-bold text-2xl sm:text-3xl text-deep-navy mb-1">How the commission works.</h2>
          <p className="text-mid-blue text-sm mb-6">The basics, plain English. Take 60 seconds with this before the calculators below.</p>

          <div className="space-y-5">

            {/* The percentages */}
            <div className="bg-accent/10 rounded-xl p-5 border-2 border-accent/40">
              <div className="text-xs uppercase font-heading font-semibold text-secondary tracking-widest mb-3">The two numbers to remember</div>
              <div className="grid sm:grid-cols-2 gap-4">
                <div>

    function CalcOutput({ rate, ap, product }) {
      if (!rate.eligible) {

      const totalY1 = ap * rate.y1;
      const advance = totalY1 * RATES.paymentSplit.advancePct;
      const residualMo = (totalY1 - advance) / RATES.paymentSplit.residualMonths.length;

      const renewalY2 = isHI ? ap * rate.renewalY2to10 : ap * rate.renewal;

    function ChargebackScenario({ formState, rate }) {
      const [cancelMonth, setCancelMonth] = useState(5);
      if (!rate.eligible) return null;
      const totalY1 = formState.ap * rate.y1;
      const advance = totalY1 * RATES.paymentSplit.advancePct;
      const residualMo = (totalY1 - advance) / 3;

      let scenario;
      if (cancelMonth <= 9) {
        const owe = (9 - cancelMonth) / 12 * totalY1;
        scenario = {
          tone: 'warn',
          headline: cancelMonth === 9 ? 'No chargeback — advance fully earned.' : `You'd owe ${fmt$(owe)} back.`,
          body: cancelMonth === 9
            ? 'At month 9 your advance is exactly equal to what you\'ve earned. No clawback applies. You won\'t receive the months 10–12 residuals.'
            : `Cancellations in months 1–9 trigger a chargeback on the unearned portion of your advance. Formula: (9 − ${cancelMonth}) ÷ 12 × ${fmt$(totalY1)} = ${fmt$(owe)}.`,
        };
      } else if (cancelMonth <= 12) {
        const monthsForfeit = 13 - cancelMonth;
        const forfeit = residualMo * monthsForfeit;
        scenario = {
          tone: 'caution',
          headline: cancelMonth === 12
            ? `No chargeback — you'd forfeit ${fmt$(residualMo)} (one residual).`
            : `No chargeback — you'd forfeit ${fmt$(forfeit)} in unpaid residuals.`,
          body: `Your advance is fully earned by month 9, so nothing is clawed back. You stop receiving the remaining ${monthsForfeit} monthly residual payment${monthsForfeit > 1 ? 's' : ''} (${fmt$(residualMo)}/mo). Renewals would have started in Year 2 — those don't pay either.`,
        };
      } else {
        scenario = {
          tone: 'good',
          headline: 'Year 1 fully earned. Renewals stop.',
          body: `Past month 12, your Year 1 commission is locked in. The policy lapsing means future renewals don't pay — but there's no clawback on Year 1.`,
        };
      }

      const palette = scenario.tone === 'warn'
        ? 'bg-red-50 border-red-200 text-red-900'
        : scenario.tone === 'caution'
        ? 'bg-amber-50 border-amber-200 text-amber-900'
        : 'bg-emerald-50 border-emerald-200 text-emerald-900';

      const sliderBg = scenario.tone === 'warn'
        ? 'linear-gradient(to right, #fecaca 0%, #fecaca ' + ((9/24)*100) + '%, #fde68a ' + ((9/24)*100) + '%, #fde68a ' + ((12/24)*100) + '%, #bbf7d0 ' + ((12/24)*100) + '%, #bbf7d0 100%)'
        : null;

      return (
        <section className="bg-white rounded-2xl p-6 sm:p-8 shadow-sm border border-light-cyan">
          <h2 className="font-heading font-bold text-2xl text-deep-navy mb-1">What if the policy cancels?</h2>

          <ScenarioBanner formState={formState} rate={rate} label="This scenario:" />

          <div className="text-xs text-mid-blue mb-4">
            A <strong className="text-secondary">cancellation</strong> means the customer stopped paying premium, formally cancelled the policy, or UNL rescinded it (e.g., misrepresentation on the application). Death or qualifying-event terminations may be treated differently — check with your CPC contact.
          </div>

          <div className="mb-5">
            <div className="flex items-baseline justify-between mb-2">
              <label className="text-xs uppercase font-heading font-semibold text-secondary tracking-wider">Policy cancels in month</label>
              <span className="font-heading font-bold text-3xl text-deep-navy tabular-nums">{cancelMonth}</span>
            </div>
            <input type="range" min={1} max={24} step={1} value={cancelMonth}
              onChange={e => setCancelMonth(parseInt(e.target.value))} className="w-full" />
            <div className="flex justify-between text-xs text-soft-blue mt-1">
              <span>1</span><span>9 · advance ends</span><span>12 · Y1 ends</span><span>24</span>
            </div>
          </div>

          <div className={`rounded-xl border-2 p-5 ${palette}`}>
            <div className="font-heading font-bold text-xl mb-2">{scenario.headline}</div>
            <div className="text-sm leading-relaxed">{scenario.body}</div>
          </div>

          <div className="mt-4 grid grid-cols-1 sm:grid-cols-3 gap-2 text-xs">
            <div className="bg-red-50 border border-red-200 rounded-lg p-3">
              <div className="font-heading font-semibold text-red-900 mb-1">Months 1–9</div>
              <div className="text-red-800">Pro-rata chargeback on the unearned portion of your advance.</div>
            </div>

              <div className="font-heading font-semibold text-amber-900 mb-1">Months 10–12</div>
              <div className="text-amber-800">No chargeback. You forfeit any unpaid residuals.</div>
            </div>
            <div className="bg-emerald-50 border border-emerald-200 rounded-lg p-3">
              <div className="font-heading font-semibold text-emerald-900 mb-1">Year 2+</div>
              <div className="text-emerald-800">Year 1 fully earned. Renewals stop when the policy lapses.</div>
            </div>
          </div>
        </section>
      );
